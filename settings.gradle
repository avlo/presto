buildscript {
    repositories {
        maven {
            url = 'https://plugins.gradle.org/m2/'
        }
    }
    dependencies {
        classpath 'com.adarshr:gradle-test-logger-plugin:4.0.0'
    }
}

rootProject.name = 'presto'

include(':lib')
include(':lib-azure')
include(':lib-core')
include(':lib-h2db')
include(':lib-jpa')
include(':lib-ldap')
include(':lib-mysql')
include(':lib-nostr')
include(':lib-web')
project(":lib").projectDir = file('lib')
project(":lib-azure").projectDir = file('lib/azure')
project(":lib-core").projectDir = file('lib/core')
project(":lib-h2db").projectDir = file('lib/h2db')
project(":lib-jpa").projectDir = file('lib/jpa')
project(":lib-ldap").projectDir = file('lib/ldap')
project(":lib-nostr").projectDir = file('lib/nostr')
project(":lib-mysql").projectDir = file('lib/mysql')
project(":lib-web").projectDir = file('lib/web')

include(':autoconfigure-azure')
include(':autoconfigure-core')
include(':autoconfigure-h2db')
include(':autoconfigure-jpa')
include(':autoconfigure-ldap')
include(':autoconfigure-mysql')
include(':autoconfigure-nostr')
include(':autoconfigure-web')
project(":autoconfigure-azure").projectDir = file('autoconfigure/azure')
project(":autoconfigure-core").projectDir = file('autoconfigure/core')
project(":autoconfigure-h2db").projectDir = file('autoconfigure/h2db')
project(":autoconfigure-jpa").projectDir = file('autoconfigure/jpa')
project(":autoconfigure-ldap").projectDir = file('autoconfigure/ldap')
project(":autoconfigure-mysql").projectDir = file('autoconfigure/mysql')
project(":autoconfigure-nostr").projectDir = file('autoconfigure/nostr')
project(":autoconfigure-web").projectDir = file('autoconfigure/web')

include(':starter-azure')
include(':starter-core')
include(':starter-h2db')
include(':starter-jpa')
include(':starter-ldap')
include(':starter-mysql')
include(':starter-nostr')
include(':starter-web')
project(":starter-azure").projectDir = file('starter/azure')
project(":starter-core").projectDir = file('starter/core')
project(":starter-h2db").projectDir = file('starter/h2db')
project(":starter-jpa").projectDir = file('starter/jpa')
project(":starter-ldap").projectDir = file('starter/ldap')
project(":starter-mysql").projectDir = file('starter/mysql')
project(":starter-nostr").projectDir = file('starter/nostr')
project(":starter-web").projectDir = file('starter/web')

