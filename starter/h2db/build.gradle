plugins {
    id 'buildlogic.java-conventions'
}

dependencies {
    api project(':autoconfigure-h2db')
    api project(':lib-h2db')
}

description = 'presto-h2db-spring-boot-starter'

publishing {
    publications {
        maven(MavenPublication) {
            artifactId = description
            from(components.java)
        }
    }
}
