plugins {
    id 'buildlogic.java-conventions'
}

description = 'presto-core-spring-boot-starter'

dependencies {
    api project(':autoconfigure-core')
    api project(':lib-h2db')
}

publishing {
    publications {
        maven(MavenPublication) {
            artifactId = description
            from(components.java)
        }
    }
}
