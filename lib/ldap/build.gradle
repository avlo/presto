plugins {
    id 'buildlogic.java-conventions'
}

description = 'lib-ldap'

dependencies {
    def springSecurityLdap = '6.2.1'
    api project(':lib-web')
    
    implementation 'org.springframework.security:spring-security-ldap:' + springSecurityLdap 
}

publishing {
    publications {
        maven(MavenPublication) {
            artifactId = description
            from(components.java)
        }
    }
}
