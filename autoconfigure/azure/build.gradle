plugins {
    id 'buildlogic.java-conventions'
}

dependencies {
    api project(':lib-core')
    api project(':lib-web')
    api project(':lib-azure')
}

description = 'autoconfigure-azure'

publishing {
    publications {
        maven(MavenPublication) {
            artifactId = description
            from(components.java)
        }
    }
}
