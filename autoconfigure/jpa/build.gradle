plugins {
    id 'buildlogic.java-conventions'
}

dependencies {
    api project(':lib-core')
    api project(':lib-web')
    api project(':lib-jpa')
}

description = 'autoconfigure-jpa'

publishing {
    publications {
        maven(MavenPublication) {
            artifactId = description
            from(components.java)
        }
    }
}
